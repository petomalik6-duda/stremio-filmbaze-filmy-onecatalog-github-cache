name: Refresh Filmbáze cache

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run full refresh? true/false"
        required: false
        default: "false"
  schedule:
    - cron: "25 3 * * *"

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Refresh cache
        run: npm run refresh
        env:
          PORT: 10000
          PUBLIC_URL: https://example.onrender.com
          FILMBAZE_MOVIES_URL: https://filmbaze.cz/novinky-s-ceskym-dabingem-na-netu
          FILMBAZE_SERIES_URL: https://filmbaze.cz/oblibene-serialy-v-cestine
          MAX_PAGES: 30
          MAX_ITEMS: 1200
          MAX_SERIES_ITEMS: 1200
          AUTO_REFRESH: "false"
          REFRESH_ON_START: "false"
          CACHE_TTL_HOURS: 24
          REQUEST_TIMEOUT_MS: 20000
          HTTP_RETRIES: 2
          ENABLE_TMDB: ${{ secrets.TMDB_API_KEY != '' && 'true' || 'false' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE: cs-CZ
          ENRICH_LIMIT: 50
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full || 'false' }}

      - name: Commit updated cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/catalog-cache.json
          git diff --cached --quiet && echo "No cache changes" || git commit -m "Refresh Filmbáze cache"
          git pull --rebase --autostash
          git push
