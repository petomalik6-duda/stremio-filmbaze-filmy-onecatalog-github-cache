name: Diagnose plain Jina SERP once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_diagnose-jina-serp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose plain Jina SERP once'
    runs-on: ubuntu-latest
    steps:
      - name: Probe plain Jina Search Foundation
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        shell: bash
        run: |
          node <<'NODE'
          const queries = ['filmbaze', 'filmbaze.cz', 'Filmbaze český dabing'];
          for (const q of queries) {
            const res = await fetch('https://llm-serp.jina.ai', {
              method:'POST',
              headers:{
                'Content-Type':'application/json',
                ...(process.env.JINA_API_KEY ? {Authorization:`Bearer ${process.env.JINA_API_KEY}`} : {})
              },
              body: JSON.stringify({q})
            });
            const text = await res.text();
            console.log(`QUERY ${JSON.stringify(q)} status=${res.status} bytes=${Buffer.byteLength(text)}`);
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            if (!payload) {
              console.log(text.replace(/\s+/g,' ').slice(0,1000));
              continue;
            }
            const results = Array.isArray(payload.results) ? payload.results : [];
            console.log(`results=${results.length}`);
            for (const [i,r] of results.slice(0,10).entries()) {
              const safe = {
                title:String(r?.title || r?.name || '').replace(/\s+/g,' ').slice(0,160),
                url:String(r?.url || r?.link || '').slice(0,260),
                snippet:String(r?.snippet || r?.description || r?.text || '').replace(/\s+/g,' ').slice(0,500)
              };
              console.log(`${i+1}. ${JSON.stringify(safe)}`);
            }
          }
          NODE
