name: Patch Jina fallback v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_patch-jina-fallback-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry Jina fallback parsing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Jina indexed fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/indexed.js')
          text = path.read_text(encoding='utf-8')

          query_pattern = r"export function jinaQueries\(type, sourceUrl\) \{.*?\n\}\n\nasync function fetchBingHints"
          query_replacement = r'''export function jinaQueries(type, sourceUrl) {
            let host = 'filmbaze.cz';
            try { host = new URL(sourceUrl).hostname.replace(/^www\./, ''); } catch {}
            if (type === 'series') {
              return [
                `"${sourceUrl}"`,
                `"Oblíbené seriály v češtině" "Poster for"`
              ];
            }
            return [
              `"${sourceUrl}"`,
              `"Novinky s českým dabingem" "Poster for"`
            ];
          }

          async function fetchBingHints'''
          text, count = re.subn(query_pattern, query_replacement, text, flags=re.S)
          if count != 1:
            raise SystemExit(f'Could not replace jinaQueries block: {count}')

          fetch_pattern = r"async function fetchJinaHints\(type, sourceUrl\) \{.*?\n\}\n\nasync function fetchBraveHints"
          fetch_replacement = r'''export function parseJinaSearchText(text, type, sourceUrl) {
            const raw = String(text || '');
            if (!raw) return [];

            let sourcePath = '';
            let host = 'filmbaze.cz';
            try {
              const parsed = new URL(sourceUrl);
              sourcePath = parsed.pathname.replace(/\/+$/, '');
              host = parsed.hostname.replace(/^www\./, '');
            } catch {}

            const normalized = raw
              .replace(/\\n/g, ' ')
              .replace(/\\t/g, ' ')
              .replace(/\\"/g, '"');
            const lower = normalized.toLowerCase();
            const contexts = [];
            const needles = [sourceUrl, `${host}${sourcePath}`, sourcePath]
              .filter(Boolean)
              .map(value => String(value).toLowerCase());

            for (const needle of needles) {
              let from = 0;
              while (from < lower.length) {
                const index = lower.indexOf(needle, from);
                if (index < 0) break;
                contexts.push(normalized.slice(Math.max(0, index - 900), Math.min(normalized.length, index + needle.length + 9000)));
                from = index + Math.max(needle.length, 1);
                if (contexts.length >= 10) break;
              }
              if (contexts.length >= 10) break;
            }

            const sectionMarker = type === 'series'
              ? /Obl[ií]ben[eé] seri[aá]ly v č[eé]štin[eě]|Obl[ií]ben[eé] seri[aá]ly/i
              : /Novinky s česk[ýy]m dabingem|Nov[eé] filmy na internetu s česk[ýy]m dabingem/i;

            if (!contexts.length) {
              const marker = normalized.match(sectionMarker);
              if (marker && typeof marker.index === 'number') {
                contexts.push(normalized.slice(Math.max(0, marker.index - 700), Math.min(normalized.length, marker.index + 9000)));
              }
            }

            const hints = [];
            for (const context of contexts) {
              const contextLower = context.toLowerCase();
              const exactPage = Boolean(sourcePath && contextLower.includes(sourcePath.toLowerCase()));
              const correctSection = sectionMarker.test(context);
              if (!exactPage && !correctSection) continue;

              hints.push(...parseLeadingHints(context, type, sourceUrl, 'jina-search-text'));
              hints.push(...parseBeforePosterHints(context, type, sourceUrl, 'jina-search-text'));
              hints.push(...parsePosterHints(context, type, sourceUrl, 'jina-search-text'));
            }

            return dedupeHints(hints).slice(0, INDEXED_FALLBACK_MAX_ITEMS);
          }

          async function fetchJinaHints(type, sourceUrl) {
            if (!JINA_API_KEY) return { items: [], errors: [], successfulQueries: 0, queries: [] };
            const items = [];
            const errors = [];
            let successfulQueries = 0;
            const queries = jinaQueries(type, sourceUrl).slice(0, JINA_SEARCH_MAX_QUERIES);

            for (let index = 0; index < queries.length; index += 1) {
              const query = queries[index];
              try {
                const params = new URLSearchParams({ q: query });
                params.append('site', 'filmbaze.cz');
                const text = await fetchText(`https://s.jina.ai/?${params.toString()}`, {
                  Authorization: `Bearer ${JINA_API_KEY}`,
                  Accept: 'application/json',
                  'X-Locale': 'cs-CZ',
                  'X-Timeout': '30'
                }, JINA_TIMEOUT_MS);
                successfulQueries += 1;

                let parsed = null;
                try { parsed = JSON.parse(text); } catch {}
                if (parsed) items.push(...parseJinaSearchJson(parsed, type, sourceUrl));
                items.push(...parseJinaSearchText(text, type, sourceUrl));

                if (dedupeHints(items).length >= Math.min(6, INDEXED_FALLBACK_MAX_ITEMS)) break;
                if (index + 1 < queries.length) await sleep(1100);
              } catch (error) {
                errors.push(`${query}: ${error.message}`);
                if (isRateLimited(error)) break;
              }
            }
            return { items: dedupeHints(items), errors, successfulQueries, queries };
          }

          async function fetchBraveHints'''
          text, count = re.subn(fetch_pattern, fetch_replacement, text, flags=re.S)
          if count != 1:
            raise SystemExit(f'Could not replace fetchJinaHints block: {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run existing fallback tests
        run: npm run test:indexed

      - name: Test Jina text recovery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { parseJinaSearchText } from './src/indexed.js';
          const url = 'https://filmbaze.cz/novinky-s-ceskym-dabingem-na-netu';
          const fixture = `Search result URL Source: ${url}\nMarkdown Content: Novinky s českým dabingem ; Poster for Tenkrát v Gaze. 5.4 / 10. Tenkrát v Gaze ; Poster for Julian. 6.7 / 10. Julian ; Poster for Zvukař. 7 / 10. Zvukař`;
          const hints = parseJinaSearchText(fixture, 'movie', url);
          assert(hints.some(x => x.name === 'Tenkrát v Gaze'));
          assert(hints.some(x => x.name === 'Zvukař'));
          assert(hints.every(x => x.indexedEvidence === 'jina-search-text'));
          console.log('Jina text recovery test: OK');
          NODE

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/indexed.js
          git commit -m "Improve Jina indexed fallback parsing"
          git pull --rebase --autostash
          git push
