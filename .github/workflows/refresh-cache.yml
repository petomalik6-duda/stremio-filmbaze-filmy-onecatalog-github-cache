name: Refresh Filmbaze cache

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full TMDB metadata rebuild (source still stays incremental/safe)"
        required: false
        default: "false"
      deep_source_scan:
        description: "Manual deeper Filmbaze scan (more requests; leave false for normal use)"
        required: false
        default: "false"
  schedule:
    - cron: "20 3 * * *"

concurrency:
  group: refresh-filmbaze-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify installed addon version
        run: node -p "'Running addon version ' + require('./package.json').version"

      - name: Configure low-request source mode
        shell: bash
        run: |
          DEEP_SOURCE_SCAN="${{ github.event.inputs.deep_source_scan || 'false' }}"

          if [ "$DEEP_SOURCE_SCAN" = "true" ]; then
            echo "Manual deep source scan enabled."
            echo "FILMBAZE_INCREMENTAL=false" >> "$GITHUB_ENV"
            echo "MAX_MOVIE_PAGES=4" >> "$GITHUB_ENV"
            echo "MAX_SERIES_PAGES=3" >> "$GITHUB_ENV"
            echo "MAX_ITEMS=200" >> "$GITHUB_ENV"
            echo "MAX_SERIES_ITEMS=150" >> "$GITHUB_ENV"
            echo "FILMBAZE_MAX_REQUESTS=8" >> "$GITHUB_ENV"
            echo "FILMBAZE_MIN_REQUEST_INTERVAL_MS=5000" >> "$GITHUB_ENV"
          else
            echo "Daily incremental source scan enabled: one page per channel."
            echo "FILMBAZE_INCREMENTAL=true" >> "$GITHUB_ENV"
            echo "MAX_MOVIE_PAGES=1" >> "$GITHUB_ENV"
            echo "MAX_SERIES_PAGES=1" >> "$GITHUB_ENV"
            echo "MAX_ITEMS=50" >> "$GITHUB_ENV"
            echo "MAX_SERIES_ITEMS=50" >> "$GITHUB_ENV"
            echo "FILMBAZE_MAX_REQUESTS=3" >> "$GITHUB_ENV"
            echo "FILMBAZE_MIN_REQUEST_INTERVAL_MS=4000" >> "$GITHUB_ENV"
          fi

      - name: Backup last valid cache
        run: |
          test -f data/catalog-cache.json
          cp data/catalog-cache.json data/catalog-cache.before-refresh.json

      - name: Refresh and repair cache
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENABLE_TMDB: "true"
          ENABLE_TMDB_EPISODES: "true"
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full || 'false' }}
          FORCE_FULL_SOURCE_REFRESH: "false"
          ENRICH_MOVIE_LIMIT: "25"
          ENRICH_SERIES_LIMIT: "10"
          REPAIR_RETRY_HOURS: "168"
          EPISODE_REPAIR_RETRY_HOURS: "336"
          MAX_EPISODE_SEASONS: "12"
          MAX_EPISODES_PER_SERIES: "250"
          CACHE_FILE: "data/catalog-cache.json"
          FILMBAZE_API_ONLY: "true"
          FILMBAZE_BETWEEN_CHANNELS_MS: "5000"
          ENABLE_FILMBAZE_DETAIL: "false"
          FILMBAZE_DETAIL_LIMIT: "0"
          USE_READER_FALLBACK: "true"
          MIN_SAFE_SOURCE_ITEMS: "500"
          MIN_SAFE_SOURCE_RATIO: "0.70"
          REQUEST_TIMEOUT_MS: "12000"
          HTTP_RETRIES: "2"
          HTTP_RETRY_BASE_MS: "1200"
          HTTP_RETRY_MAX_MS: "6000"
        run: npm run refresh

      - name: Restore missing items after incremental source response
        env:
          CACHE_FILE: "data/catalog-cache.json"
          PREVIOUS_CACHE_FILE: "data/catalog-cache.before-refresh.json"
          MIN_SAFE_SOURCE_ITEMS: "500"
          MIN_SAFE_SOURCE_RATIO: "0.70"
        run: npm run safe-merge-cache

      - name: Show latest titles that will be served
        env:
          CACHE_FILE: "data/catalog-cache.json"
        run: npm run report-latest

      - name: Verify cache was refreshed recently
        env:
          CACHE_FILE: "data/catalog-cache.json"
          MAX_CACHE_AGE_HOURS: "48"
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = process.env.CACHE_FILE || 'data/catalog-cache.json';
          const maxHours = Number(process.env.MAX_CACHE_AGE_HOURS || 48);
          const cache = JSON.parse(fs.readFileSync(file, 'utf8'));
          const at = Number(cache.at || 0);
          const ageHours = at ? (Date.now() - at) / 3600000 : Infinity;
          console.log('Cache generated at:', at ? new Date(at).toISOString() : 'missing');
          console.log('Cache age hours:', Number.isFinite(ageHours) ? ageHours.toFixed(2) : 'infinite');
          console.log('Refresh stats:', JSON.stringify(cache.refreshStats || null));
          if (!at || ageHours > maxHours) {
            console.error(`Cache is older than ${maxHours} hours. Filmbáze/API and reader fallback did not produce a fresh cache.`);
            process.exit(1);
          }
          NODE

      - name: Validate generated cache
        env:
          CACHE_FILE: "data/catalog-cache.json"
          MIN_CACHE_ITEMS: "500"
          MIN_CACHE_MOVIES: "400"
          MIN_CACHE_SERIES: "50"
          MAX_CACHE_DROP_RATIO: "0.20"
          MIN_SERIES_EPISODE_COVERAGE: "0.80"
        run: npm run validate-cache

      - name: Remove temporary backup
        run: rm -f data/catalog-cache.before-refresh.json

      - name: Commit refreshed cache safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/catalog-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes (source may have been unchanged or WEDOS-blocked)."
            exit 0
          fi
          git commit -m "Refresh Filmbaze cache v3.5.1"
          git pull --rebase --autostash
          git push
