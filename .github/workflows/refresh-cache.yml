name: Refresh Filmbaze cache

on:
  workflow_dispatch:
  schedule:
    # každý deň o 03:20 UTC
    - cron: "20 3 * * *"

concurrency:
  group: refresh-filmbaze-cache
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Refresh cache
        run: |
          if npm run | grep -q " refresh"; then
            npm run refresh
          elif [ -f scripts/refresh.js ]; then
            node scripts/refresh.js
          elif [ -f refresh-cache-with-repair.cjs ]; then
            node refresh-cache-with-repair.cjs
          elif [ -f scripts/refresh-cache.js ]; then
            node scripts/refresh-cache.js
          elif [ -f refresh-cache.js ]; then
            node refresh-cache.js
          else
            echo "ERROR: No refresh script found."
            echo "Available files:"
            ls -la
            echo "Available scripts:"
            npm run
            exit 1
          fi

      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # uložíme nový cache súbor bokom
          mkdir -p /tmp/filmbaze-cache

          if [ -f data/catalog-cache.json ]; then
            cp data/catalog-cache.json /tmp/filmbaze-cache/catalog-cache.json
          else
            echo "ERROR: data/catalog-cache.json was not created."
            echo "Data folder:"
            ls -la data || true
            exit 1
          fi

          # stiahneme najnovší main bez rebase konfliktu
          git fetch origin main
          git reset --hard origin/main

          # vrátime nový vygenerovaný cache súbor
          mkdir -p data
          cp /tmp/filmbaze-cache/catalog-cache.json data/catalog-cache.json

          git add data/catalog-cache.json

          # ak sa nič nezmenilo, skončíme bez chyby
          if git diff --cached --quiet; then
            echo "No cache changes"
            exit 0
          fi

          git commit -m "Refresh Filmbaze cache"
          git push origin HEAD:main
