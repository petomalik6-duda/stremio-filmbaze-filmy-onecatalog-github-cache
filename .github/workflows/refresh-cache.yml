name: Refresh Filmbaze cache

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Show project files
        run: |
          echo "Root files:"
          ls -la
          echo "Scripts folder:"
          ls -la scripts || true
          echo "Data folder:"
          ls -la data || true
          echo "Package scripts:"
          npm run || true

      - name: Run existing refresh cache
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -f scripts/refresh-cache.js ]; then
            echo "Running scripts/refresh-cache.js"
            node scripts/refresh-cache.js
          elif [ -f scripts/refresh-cache.cjs ]; then
            echo "Running scripts/refresh-cache.cjs"
            node scripts/refresh-cache.cjs
          elif [ -f scripts/update-cache.js ]; then
            echo "Running scripts/update-cache.js"
            node scripts/update-cache.js
          elif [ -f scripts/update-cache.cjs ]; then
            echo "Running scripts/update-cache.cjs"
            node scripts/update-cache.cjs
          elif [ -f scripts/build-cache.js ]; then
            echo "Running scripts/build-cache.js"
            node scripts/build-cache.js
          elif [ -f scripts/build-cache.cjs ]; then
            echo "Running scripts/build-cache.cjs"
            node scripts/build-cache.cjs
          elif npm run | grep -q "refresh-cache"; then
            echo "Running npm run refresh-cache"
            npm run refresh-cache
          else
            echo "ERROR: No refresh cache script found."
            echo "Refresh was NOT executed."
            echo "Available root files:"
            ls -la
            echo "Available scripts:"
            ls -la scripts || true
            exit 1
          fi

      - name: Repair missing IMDb IDs from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -f scripts/filmbaze-imdbid-repair.cjs ]; then
            echo "Running IMDb repair"
            node scripts/filmbaze-imdbid-repair.cjs
          else
            echo "scripts/filmbaze-imdbid-repair.cjs not found, skipping IMDb repair."
          fi

      - name: Show cache stats after refresh
        run: |
          echo "JSON files:"
          find . -maxdepth 4 -name "*.json" -not -path "./node_modules/*" -print

          echo "Data folder:"
          ls -lah data || true

          echo "Search for cache fields:"
          grep -R '"items"' data *.json 2>/dev/null | head -20 || true
          grep -R '"sourceHash"' data *.json 2>/dev/null | head -20 || true
          grep -R '"imdbRepairAt"' data *.json 2>/dev/null | head -20 || true

      - name: Commit updated cache
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Refresh Filmbaze cache"
            git push
          fi
