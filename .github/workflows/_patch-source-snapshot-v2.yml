name: Patch source snapshot code once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_patch-source-snapshot-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add source snapshot code safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add source snapshot code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/filmbaze.js')
          text = path.read_text(encoding='utf-8')
          old_import = "import crypto from 'crypto';\nimport * as cheerio from 'cheerio';"
          new_import = "import crypto from 'crypto';\nimport fs from 'fs/promises';\nimport path from 'path';\nimport * as cheerio from 'cheerio';"
          if old_import not in text:
            raise SystemExit('filmbaze imports anchor missing')
          text = text.replace(old_import, new_import, 1)

          anchor = "const MAX_SERIES_PAGES = Math.max(1, Number(process.env.MAX_SERIES_PAGES || (FILMBAZE_INCREMENTAL ? 1 : MAX_PAGES)));\n"
          snapshot_code = r'''

          const USE_SOURCE_SNAPSHOT = String(process.env.USE_SOURCE_SNAPSHOT || 'true').toLowerCase() !== 'false';
          const FILMBAZE_SOURCE_SNAPSHOT_FILE = process.env.FILMBAZE_SOURCE_SNAPSHOT_FILE || path.join(process.cwd(), 'data', 'filmbaze-source-snapshot.json');
          const FILMBAZE_SOURCE_SNAPSHOT_MAX_AGE_HOURS = Math.max(1, Number(process.env.FILMBAZE_SOURCE_SNAPSHOT_MAX_AGE_HOURS || 36));

          export async function loadFilmbazeSourceSnapshot(
            filePath = FILMBAZE_SOURCE_SNAPSHOT_FILE,
            maxAgeHours = FILMBAZE_SOURCE_SNAPSHOT_MAX_AGE_HOURS
          ) {
            if (!USE_SOURCE_SNAPSHOT) return null;
            try {
              const raw = JSON.parse(await fs.readFile(filePath, 'utf8'));
              const generatedAt = String(raw?.generatedAt || raw?.createdAt || '');
              const generatedMs = Date.parse(generatedAt);
              if (!Number.isFinite(generatedMs)) {
                console.warn('[filmbaze] source snapshot ignored: missing/invalid generatedAt');
                return null;
              }
              const ageMs = Date.now() - generatedMs;
              if (ageMs < -10 * 60 * 1000) {
                console.warn('[filmbaze] source snapshot ignored: timestamp is in the future');
                return null;
              }
              if (ageMs > Number(maxAgeHours) * 60 * 60 * 1000) {
                console.warn(`[filmbaze] source snapshot ignored: ${Math.round(ageMs / 3600000)}h old (max ${maxAgeHours}h)`);
                return null;
              }
              const items = Array.isArray(raw?.items)
                ? raw.items.filter(item => item && ['movie', 'series'].includes(item.type) && item.id && clean(item.name))
                : [];
              const movies = items.filter(item => item.type === 'movie').length;
              const series = items.filter(item => item.type === 'series').length;
              if (!items.length || movies < 1 || series < 1) {
                console.warn(`[filmbaze] source snapshot ignored: incomplete (${movies} movies, ${series} series)`);
                return null;
              }
              return {
                generatedAt,
                ageHours: Math.max(0, ageMs / 3600000),
                sourceHash: String(raw?.sourceHash || ''),
                items: dedupe(items),
                movies,
                series,
                filePath
              };
            } catch (error) {
              if (error?.code !== 'ENOENT') console.warn(`[filmbaze] source snapshot ignored: ${error.message}`);
              return null;
            }
          }
          '''
          if anchor not in text:
            raise SystemExit('filmbaze constants anchor missing')
          text = text.replace(anchor, anchor + snapshot_code, 1)

          fetch_anchor = "export async function fetchFilmbazeItems() {\n  lastDebug = { movies: [], series: [], errors: [] };\n"
          snapshot_fetch = r'''

            // Prefer a fresh snapshot created from an IP that Filmbáze permits.
            // A fresh snapshot makes the GitHub refresh send zero requests to
            // Filmbáze, avoiding repeated WEDOS hits from cloud ranges.
            const sourceSnapshot = await loadFilmbazeSourceSnapshot();
            if (sourceSnapshot) {
              const items = sourceSnapshot.items.map((item, index) => ({
                ...item,
                channelOrder: Number.isFinite(item.channelOrder) ? item.channelOrder : index,
                page: item.page || 1
              }));
              const sourceHash = sourceSnapshot.sourceHash || crypto.createHash('sha1')
                .update(items.map(x => `${x.type}|${x.id}|${x.name}|${x.releaseDate || ''}`).join('|'))
                .digest('hex');
              console.warn(`[filmbaze] using fresh source snapshot: ${sourceSnapshot.movies} movies + ${sourceSnapshot.series} series; age=${sourceSnapshot.ageHours.toFixed(2)}h`);
              return {
                sourceUrl: MOVIES_URL,
                moviesUrl: MOVIES_URL,
                seriesUrl: SERIES_URL,
                sourceHash,
                items,
                blocked: false,
                blockReason: null,
                requestState: getFilmbazeRequestState(),
                incremental: true,
                snapshotFallback: true,
                snapshotGeneratedAt: sourceSnapshot.generatedAt,
                snapshotAgeHours: sourceSnapshot.ageHours,
                snapshotItems: items.length,
                indexedFallback: false,
                indexedProviders: [],
                indexedAttemptedProviders: [],
                indexedQueries: [],
                indexedErrors: [],
                indexedItems: 0,
                indexedSerpApiConfigured: false,
                indexedSerpApiSuccessfulQueries: 0,
                indexedSerpApiResponseBytes: 0,
                indexedSerpApiResults: 0,
                indexedSerpApiResultSamples: []
              };
            }
          '''
          if fetch_anchor not in text:
            raise SystemExit('fetchFilmbazeItems anchor missing')
          text = text.replace(fetch_anchor, fetch_anchor + snapshot_fetch, 1)
          path.write_text(text, encoding='utf-8')

          snapshot_script = r'''import fs from 'fs/promises';
          import path from 'path';

          process.env.FILMBAZE_INCREMENTAL = 'true';
          process.env.MAX_MOVIE_PAGES = '1';
          process.env.MAX_SERIES_PAGES = '1';
          process.env.MAX_ITEMS = '50';
          process.env.MAX_SERIES_ITEMS = '50';
          process.env.FILMBAZE_MAX_REQUESTS = '3';
          process.env.FILMBAZE_MIN_REQUEST_INTERVAL_MS = '4000';
          process.env.FILMBAZE_BETWEEN_CHANNELS_MS = '5000';
          process.env.FILMBAZE_API_ONLY = 'true';
          process.env.ENABLE_FILMBAZE_DETAIL = 'false';
          process.env.FILMBAZE_DETAIL_LIMIT = '0';
          process.env.USE_READER_FALLBACK = 'false';
          process.env.USE_INDEXED_FALLBACK = 'false';
          process.env.USE_SOURCE_SNAPSHOT = 'false';
          process.env.HTTP_RETRIES = '1';

          const { fetchFilmbazeItems } = await import(`../src/filmbaze.js?local-snapshot=${Date.now()}`);
          const fetched = await fetchFilmbazeItems();
          const items = Array.isArray(fetched?.items) ? fetched.items : [];
          const movies = items.filter(item => item.type === 'movie').length;
          const series = items.filter(item => item.type === 'series').length;

          if (fetched?.blocked) {
            throw new Error(`Filmbáze blocked this network: ${fetched.blockReason || 'WEDOS/security response'}`);
          }
          if (movies < 1 || series < 1) {
            throw new Error(`Incomplete Filmbáze snapshot: ${movies} movies, ${series} series.`);
          }

          const output = process.env.FILMBAZE_SOURCE_SNAPSHOT_FILE || path.join(process.cwd(), 'data', 'filmbaze-source-snapshot.json');
          await fs.mkdir(path.dirname(output), { recursive: true });
          const snapshot = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            sourceHash: fetched.sourceHash || '',
            movies,
            series,
            items
          };
          const tmp = `${output}.tmp`;
          await fs.writeFile(tmp, `${JSON.stringify(snapshot, null, 2)}\n`, 'utf8');
          await fs.rename(tmp, output);
          console.log(`Filmbáze source snapshot saved: ${output}`);
          console.log(`Generated: ${snapshot.generatedAt}`);
          console.log(`Movies: ${movies}; series: ${series}; total: ${items.length}`);
          '''
          Path('scripts/update-source-snapshot-local.mjs').write_text(snapshot_script.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '3.6.7'
          package['description'] = 'Filmbaze catalog/meta addon with WEDOS-safe source snapshots, incremental cache merge, strict TMDB/IMDb promotion and defensive fallbacks.'
          package.setdefault('scripts', {})['snapshot:local'] = 'node scripts/update-source-snapshot-local.mjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          section = '''## WEDOS-safe source snapshot (v3.6.7)\n\nGitHub/Azure cloud IPs can be blocked by WEDOS before the first Filmbáze API response. v3.6.7 therefore supports a small source snapshot created from a network where Filmbáze permits normal access. No CAPTCHA or security challenge is bypassed.\n\nOn an allowed computer/network:\n\n```bash\nnpm ci\nnpm run snapshot:local\ngit add data/filmbaze-source-snapshot.json\ngit commit -m "Update Filmbaze source snapshot"\ngit push\n```\n\nA fresh snapshot contains only the newest page of movies and series. The normal incremental refresh merges it with the validated historical cache. A snapshot is accepted only when it contains both movies and series and is at most 36 hours old. If the local network is WEDOS-blocked too, `snapshot:local` fails instead of attempting to bypass the challenge.\n\n'''
          if not readme.startswith('## WEDOS-safe source snapshot (v3.6.7)'):
            readme_path.write_text(section + readme, encoding='utf-8')
          PY

      - name: Update lockfile and install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Test
        shell: bash
        run: |
          npm run test:indexed
          node --check src/filmbaze.js
          node --check scripts/update-source-snapshot-local.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'fs/promises';
          import os from 'os';
          import path from 'path';
          const { loadFilmbazeSourceSnapshot } = await import('./src/filmbaze.js?test-snapshot=2');
          const dir = await fs.mkdtemp(path.join(os.tmpdir(), 'filmbaze-snapshot-'));
          const file = path.join(dir, 'snapshot.json');
          const items = [
            {id:'1', type:'movie', name:'Test movie'},
            {id:'2', type:'series', name:'Test series'}
          ];
          await fs.writeFile(file, JSON.stringify({generatedAt:new Date().toISOString(), items}), 'utf8');
          const loaded = await loadFilmbazeSourceSnapshot(file, 36);
          assert.equal(loaded.movies, 1);
          assert.equal(loaded.series, 1);
          console.log('snapshot test: OK');
          NODE
          git diff --check

      - name: Commit non-workflow changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/filmbaze.js scripts/update-source-snapshot-local.mjs package.json package-lock.json README.md
          git commit -m "Add WEDOS-safe source snapshot refresh"
          git pull --rebase --autostash
          git push
