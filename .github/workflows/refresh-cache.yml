name: Refresh Filmbaze cache

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full TMDB rebuild"
        required: false
        default: "false"
  schedule:
    - cron: "20 3 * * *"

concurrency:
  group: refresh-filmbaze-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh and repair cache
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ENABLE_TMDB: "true"
          ENABLE_TMDB_EPISODES: "true"
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full || 'false' }}
          ENRICH_MOVIE_LIMIT: "120"
          ENRICH_SERIES_LIMIT: "200"
          REPAIR_RETRY_HOURS: "72"
          EPISODE_REPAIR_RETRY_HOURS: "0"
          MAX_EPISODE_SEASONS: "30"
          MAX_EPISODES_PER_SERIES: "1000"
          CACHE_FILE: "data/catalog-cache.json"
          HTTP_RETRIES: "4"
          HTTP_RETRY_BASE_MS: "1000"
          HTTP_RETRY_MAX_MS: "30000"
        run: npm run refresh

      - name: Validate generated cache
        env:
          CACHE_FILE: "data/catalog-cache.json"
          HTTP_RETRIES: "4"
          HTTP_RETRY_BASE_MS: "1000"
          HTTP_RETRY_MAX_MS: "30000"
          MIN_CACHE_ITEMS: "500"
          MIN_CACHE_MOVIES: "400"
          MIN_CACHE_SERIES: "50"
          MAX_CACHE_DROP_RATIO: "0.20"
          MIN_SERIES_EPISODE_COVERAGE: "0.80"
        run: npm run validate-cache

      - name: Preserve generated cache
        run: |
          mkdir -p /tmp/filmbaze-cache
          cp data/catalog-cache.json /tmp/filmbaze-cache/catalog-cache.json

      - name: Commit refreshed cache safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          cp /tmp/filmbaze-cache/catalog-cache.json data/catalog-cache.json
          git add data/catalog-cache.json

          if git diff --cached --quiet; then
            echo "No cache changes"
            exit 0
          fi

          git commit -m "Refresh Filmbaze cache v3.4.3"
          git push origin HEAD:main
