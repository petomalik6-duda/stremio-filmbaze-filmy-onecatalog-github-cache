name: Dispatch Filmbaze refresh after Jina patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_dispatch-refresh-after-jina.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Trigger Filmbaze refresh after Jina patch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch refresh workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-cache.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f force_full=false \
            -f deep_source_scan=false
